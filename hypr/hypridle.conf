general {
  lock_cmd = pidof hyprlock || hyprlock
  # lock before suspend (lid close, idle suspend, systemctl suspend, ...)
  before_sleep_cmd = loginctl lock-session
  # turn screens back on after resume without needing a key press
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
  # hold off suspend until hyprlock has actually locked the session
  inhibit_sleep = 3
}

# turn off screens after 10 minutes
listener {
  timeout = 600
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# lock after 20 minutes
listener {
  timeout = 1200
  on-timeout = loginctl lock-session
}

# sleep after 30 minutes
listener {
  timeout = 1800
  on-timeout = systemctl suspend
}
